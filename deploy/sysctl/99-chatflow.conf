# =============================================================================
# ChatFlow · 内核参数（2 GiB 机器）
#
# 部署位置: /etc/sysctl.d/99-chatflow.conf
# 生效:     sysctl --system
# =============================================================================

# ---------------------------------------------------------------------------
# 交换
# ---------------------------------------------------------------------------
# 2 GiB 跑 PG + Redis + Node + Nginx，稳态占用约 1.3 GB，日常够。
# 但 `npm ci`、V8 的一次压缩、PG 的 autovacuum 同时上来就会顶到天花板。
# 没有 swap 时 Linux 的选择是直接 OOM kill —— 而它往往挑 RSS 最大的进程，
# 也就是 PostgreSQL。一次 OOM 等于一次数据库重启 + 所有连接被掐。
#
# 10 而不是默认的 60: 让内核优先回收 page cache，实在不行才换页到磁盘。
# swap 在 ESSD 上还能接受，但换页终究比读缓存慢两个数量级，能不用就不用。
vm.swappiness = 10

# 允许内存超配。Redis fork 做快照时需要（本项目已关掉 RDB，
# 但 ioredis 和 PG 在 fork 场景下同样受益）。设 0 会在内存紧张时 fork 失败
vm.overcommit_memory = 1

# ---------------------------------------------------------------------------
# 网络
# ---------------------------------------------------------------------------
# Socket.IO 单实例承载几百个长连接。默认的 128 接受队列偏小，
# 突发重连（比如发版后所有人同时回来）时会出现 SYN 被丢弃 → 客户端等 3s 重试
net.core.somaxconn = 1024

# 每个 socket 的读/写缓冲上限。默认 4MB 足够，压小一点限制单个连接的内存占用
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304

# 复用 TIME_WAIT 连接。压测里 4000+ 请求会留下一堆 TIME_WAIT
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# 开 TCP keepalive 并缩短探测周期。
# 客户端断网/拔网线时不会发 FIN，服务端只有靠 keepalive 才能发现
# （应用层的 Socket.IO 心跳是另一道防线，两层都要有）
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# ---------------------------------------------------------------------------
# 文件句柄
# ---------------------------------------------------------------------------
# 每个 WebSocket 连接占 1 个 fd，每个 PG 连接占 1 个，
# 加上日志、静态文件，几百人同时在线就要上千个
fs.file-max = 200000
