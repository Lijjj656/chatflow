# =============================================================================
# ChatFlow · Redis 覆盖配置（Ubuntu 22.04 / Redis 6.0.16）
#
# 部署位置: /etc/redis/chatflow.conf
# 生效方式: setup-server.sh 会在 /etc/redis/redis.conf 末尾追加一行
#           include /etc/redis/chatflow.conf
#           （放末尾才能覆盖前面的默认值；Redis 是"后出现的配置生效"）
#
# 这个 Redis 实例只存一种数据: 在线状态。
#   presence:user:<id>  ZSET  member=socketId, score=最后心跳时间(ms)
#   presence:online     SET   在线的 userId
# 这些数据都是"可推导"的 —— 丢了以后下一次心跳（25s 内）就重新长出来，
# 代价只是有人头像短暂显示成离线。所以完全不需要持久化。
# =============================================================================

# 只监听本机。Redis 默认无密码，暴露公网等于把服务器交给别人。
#
# ⚠️ 这里只写 IPv4: Ubuntu 22.04 带的是 Redis 6.0.16，
#    而 `bind 127.0.0.1 -::1`（`-` 表示"这个地址可失败"）是 **Redis 7.0** 才有的语法。
#    在 6.0 上它会报 Could not create server TCP listening socket -::1:6379，
#    然后整个服务起不来 —— 而 systemd 只会告诉你 "failed with result 'exit-code'"。
#    应用侧连的是 127.0.0.1，本来也不需要 IPv6。
bind 127.0.0.1
protected-mode yes
port 6379

# ---------------------------------------------------------------------------
# 内存上限
# ---------------------------------------------------------------------------
# 一个在线用户的 ZSET 成员约 60~80 字节，1 万人同时在线也只有几 MB。
# 256MB 是给"没人清理的脏数据 + Lua 脚本开销"留的富余。
maxmemory 256mb

# 到上限后淘汰"最久没用"的 key。
# 对在线状态来说，被淘汰 = 这个人暂时显示离线，但他的下一次心跳会
# 重新 addConnection 建回来 —— 自愈。所以 allkeys-lru 是这里最合适的选择，
# noeviction 反而更糟（写失败会让 presence.addConnection 抛错）。
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------------------
# 持久化: 全部关闭
# ---------------------------------------------------------------------------
# 关掉 RDB 快照。理由:
#   1. 数据可重建，快照没有价值
#   2. 每次 fork 子进程做快照，在 2G 内存的机器上是一次真实的 COW 内存尖峰，
#      而且 fork 的瞬间会阻塞主线程 —— 表现为"偶尔卡一下几十毫秒"
#   3. 不留 dump.rdb，磁盘也干净
save ""

# 关掉 AOF。同理，而且 AOF 的 fsync 会带来持续的写盘
appendonly no

# ---------------------------------------------------------------------------
# 连接
# ---------------------------------------------------------------------------
# 不主动断开空闲连接。ioredis 的连接池是长连接，被 Redis 单方面断掉后
# 客户端要重连 + 重新握手（HELLO/CLIENT SETINFO），抖一下就是几百毫秒
timeout 0
tcp-keepalive 300

# 2 核机器上 Redis 是单线程的，太多客户端连接只会增加上下文切换
maxclients 200

# 慢查询阈值 10ms。在线状态的 Lua 脚本都在 1ms 以内，
# 超过 10ms 基本就是有异常的大 key 或阻塞命令
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
loglevel notice
# 交给 systemd journal（不写文件，免得到处都是一个 logfile）
logfile ""
