# =============================================================================
# ChatFlow · Nginx 站点配置（IP 直连，80 端口，暂无域名/HTTPS）
#
# 部署位置: /etc/nginx/sites-available/chatflow
# 启用:     ln -s /etc/nginx/sites-available/chatflow /etc/nginx/sites-enabled/
# 校验:     nginx -t && systemctl reload nginx
#
# 三个反代前缀和前端代码里写死的路径完全对应（见 client/vite.config.js 的 proxy），
# 所以前端从开发到生产一行代码都不用改:
#   /api       → 业务接口
#   /uploads   → 用户上传的头像（这里直接由 Nginx 读盘，不绕 Node）
#   /socket.io → Socket.IO（必须带 WebSocket 升级头，见下面的长注释）
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 没有域名，用 IP + 兜底 server_name。
    # 保留 `_` 是为了以后域名备案下来时只需要把域名追加上来，不用改结构。
    server_name 47.111.223.71 _;

    # 前端构建产物。
    #
    # ⚠️ 指向 .../client/dist，不是 .../client。
    #    发布脚本把 vite 的产物整个拷到 client/dist/（dist 是一个独立命名的
    #    构建产物，和源码分开），index.html 在 dist 里面。
    #    写错这一层的症状不是 404 而是 **403 Forbidden**:
    #      root 指向 client/ 时，请求 / 命中 client/ 这个**目录**，
    #      index index.html 在目录里找不到 → autoindex off → 403。
    #    日志里只有 "directory index of ... is forbidden"，看不出是路径配置错了。
    root /var/www/chatflow/client/dist;
    index index.html;

    charset utf-8;

    # -------------------------------------------------------------------------
    # 压缩
    #
    # Ubuntu 自带的 nginx.conf 里 `gzip on` 是开着的，但 `gzip_types` 被注释掉了，
    # 而默认值是 **只有 text/html**。于是 .js/.css/.json 全都是明文传输 ——
    # 首页入口 bundle 70 KB，压缩后只有 27 KB，也就是 5 Mbps 带宽上
    # 首屏多花 70 ms 且白烧流量。这一项不配，前面所有的静态缓存优化都打了对折。
    #
    # comp_level 5 而不是 9: 9 只比 5 小 1~2%，但 CPU 时间翻倍。
    # 2 核机器上每个请求都压缩一次，不值得。
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # -------------------------------------------------------------------------
    # 请求体上限
    #
    # Nginx 默认 1MB，而后端允许头像 2MB（MAX_AVATAR_BYTES=2097152）。
    # 不放开这一项的症状很典型: 上传小图正常，稍大一点直接 413，
    # 而且后端日志里**什么都没有** —— 请求根本没进 Node。
    # 留 5MB 是给 multipart 的边界/表单字段留余量。
    # -------------------------------------------------------------------------
    client_max_body_size 5m;
    client_body_timeout 30s;

    # 日志
    access_log /var/log/nginx/chatflow.access.log;
    error_log  /var/log/nginx/chatflow.error.log warn;

    # -------------------------------------------------------------------------
    # 基础安全头
    # 后端已经用 helmet 发过一套，但静态文件不经过 Node，
    # 所以这一层必须自己补上（重复不冲突，浏览器取最严格的）。
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # -------------------------------------------------------------------------
    # 前端 SPA
    #
    # history 模式的坑: /chat/123 这种路径在磁盘上没有对应文件，
    # 不回落到 index.html 就是 404。而 /api/xxx 绝不能回落 ——
    # 否则接口 404 会变成一坨 HTML，前端 JSON.parse 直接抛异常。
    # 前缀匹配有优先级: ^~ 与更长的 location 会先命中，所以下面的
    # /api/、/uploads/、/socket.io/ 不会走到这里。
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能缓存。
    # Vite 产物的文件名带 content hash，唯独 index.html 不带 ——
    # 它一旦被 CDN/浏览器缓存住，用户永远拿不到新的 assets 名字，
    # 表现为"改了代码，线上没变化"，刷新、重装都没用。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # hash 静态资源可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # 不允许访问隐藏文件（.env、.git 之类）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # 业务接口
    #
    # proxy_pass 后面**不带** URI，所以 /api/users 会原样转发成 /api/users。
    # 一旦写成 http://127.0.0.1:3100/ ，末尾那个斜杠会吃掉 /api 前缀，
    # 后端全部 404 —— 这是反代最常见的写法错误。
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # 这三行是trust proxy 生效的前提。
        # 不传 X-Forwarded-For，后端看到的客户端 IP 全都是 127.0.0.1，
        # 于是全站共用同一个限流桶（登录 15 分钟 10 次变成全球共享）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 接口响应都很小（最大的会话列表 30KB），开 buffer
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # -------------------------------------------------------------------------
    # 头像
    #
    # 直接由 Nginx 读盘，不经过 Node。理由:
    #   1. 静态文件让 Node 去 createReadStream 是白白占用那唯一的核心
    #   2. 后端虽然也挂了 express.static（为了让本地开发不用装 Nginx），
    #      生产环境这一层才是实际生效的那一层
    #
    # alias 的坑: 目录结尾必须有斜杠，且 location 结尾也必须有斜杠，
    # 否则 /uploads/avatars/x.webp 会被拼成 uploadsavatars/x.webp。
    # -------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/chatflow/data/uploads/;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Socket.IO —— 全站最容易配错的一段
    #
    # 少任何一行都不会报错，只会"实时消息时好时坏":
    #
    # · proxy_http_version 1.1
    #   WebSocket 握手是 HTTP/1.1 的 Upgrade 请求。Nginx 默认给 upstream 用
    #   1.0，Upgrade 头直接被丢弃 → 永远停在长轮询。
    #
    # · Upgrade / Connection 两个头
    #   Connection 必须写死 "upgrade"，不能用 $connection_upgrade 变量，
    #   除非在 http 块里配了 map。写死对单 upstream 完全够用。
    #
    # · proxy_read_timeout（关键）
    #   后端 pingInterval=25s、pingTimeout=20s（见 src/socket/index.js）。
    #   空闲连接上 Nginx 只在有数据时才重置这个计时器，而心跳是 25s 一次。
    #   默认 60s 看似够用，但客户端网络抖动一次（心跳晚到）+ 重连退避，
    #   很容易连续 60s 没有任何数据 → Nginx 单方面断开，
    #   前端看到的就是"每隔几分钟掉线一次，然后自己又好了"。
    #   设 75s = 3 个心跳周期，留足余量。
    #
    # · proxy_buffering off
    #   长连接上的数据必须立刻下发。开着 buffer 会让消息延迟到缓冲区满，
    #   表现为"对方半天收不到，一刷新全来了"。
    # -------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
        proxy_send_timeout    75s;

        proxy_buffering off;
    }

    # 健康检查顺手暴露给运维（只读，不涉及业务数据）
    location = /healthz {
        proxy_pass http://127.0.0.1:3100/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
