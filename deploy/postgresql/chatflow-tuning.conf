# =============================================================================
# ChatFlow · PostgreSQL 调参
#
# 部署位置: /etc/postgresql/<版本>/main/conf.d/chatflow.conf
#           （Debian/Ubuntu 打包版默认 include_dir = 'conf.d'）
# 生效:     systemctl restart postgresql
#
# ⚠️ 本机是**复用已有集群**（PG 14.24），上面还跑着另一个项目（signup）。
#    所以这里不能按"这台机器只跑 ChatFlow"来调：
#      - max_connections 不能压到 30，另一个应用也要连
#      - 重启会让那个应用中断 1~2 秒
#    如果换到一台干净机器（只有 ChatFlow），可以按注释里的"独占"取值调紧。
#
# 原则: 2 GiB 的机器上，宁可给 PG 少一点 —— 如果 PG 把内存吃满，
#       Node 和 Redis 会被 OOM killer 挑走，而它往往挑 RSS 最大的那个，
#       也就是 PostgreSQL 自己。
# =============================================================================

# 只听本机。绝不 0.0.0.0 —— 5432 暴露公网会被挂满挖矿脚本
listen_addresses = 'localhost'

# ---------------------------------------------------------------------------
# 内存
# ---------------------------------------------------------------------------

# 专用缓存池。默认 128MB；提到 256MB 是因为会话列表要连着扫
# conversation_members × messages 的聚合（阶段 9 实测单请求 5.26ms / 240 会话）。
# 独占机器可以给到 384MB；共享机器 256MB 是安全上限
shared_buffers = 256MB

# 优化器估算"OS 缓存 + shared_buffers"用。设低了会误判走全表扫描
effective_cache_size = 768MB

# 排序/哈希每个算子可用内存。注意是**每个算子**，一个大查询里有 3 个
# 排序就是 3 份。会话列表那种多子查询的语句会放大这个值，所以压到 4MB
work_mem = 4MB

# 建索引/VACUUM 用，只在维护时占用
maintenance_work_mem = 64MB

# ---------------------------------------------------------------------------
# 连接数
# ---------------------------------------------------------------------------
# 应用侧走连接池（见 src/config/db.js），稳态只占十几条。
# 不压到 30 的原因: 这个集群上还有 signup 在用。
# 独占机器可以改成 30（每连接 2~4MB 私有内存，200 个连接在 2G 机器上就是自杀）
max_connections = 60

# ---------------------------------------------------------------------------
# WAL / 检查点
# ---------------------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
wal_buffers = 8MB

# 把检查点的写放大摊平。0.9 意味着几乎整个 checkpoint 周期都在均匀刷盘，
# 而不是最后时刻集中刷一波造成周期性卡顿
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# 存储特性
# ---------------------------------------------------------------------------
# ESSD 云盘的随机读代价远低于机械盘。默认 4.0 会让优化器过度害怕随机读，
# 该走索引的查询被改成顺序扫。SSD 上 1.1 是通行取值
random_page_cost = 1.1
effective_io_concurrency = 100

default_statistics_target = 100

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
# 记录超过 200ms 的语句。阶段 9 实测会话列表 SQL 是 5.26ms，
# 超过 200ms 说明要么数据量涨了、要么回到全表扫描了
log_min_duration_statement = 200ms
log_checkpoints = off
log_lock_waits = on
log_temp_files = 10MB

# 时间统一 UTC，与应用侧 db.js 的 `-c timezone=UTC` 一致
timezone = 'UTC'
log_timezone = 'UTC'

# ---------------------------------------------------------------------------
# 自动维护
# ---------------------------------------------------------------------------
# messages 表是纯追加的，autovacuum 主要以"防止事务 ID 回卷"为目的。
# 默认比例 0.2 在 4.8 万行的表上意味着要改 9600 行才触发，
# 对这张表来说太懒了
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
